<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>ورود به سامانه حضور و غیاب دانشگاه صنعتی شیراز</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, Arial, sans-serif;
            font-weight: 700;
            background:
                linear-gradient(
                    rgba(31, 55, 92, 0.74),
                    rgba(31, 55, 92, 0.74)
                ),
                url("/css/persepolis-login.webp")
                center center / cover no-repeat fixed;
            background-color: #274065;
        }

        .login-card {
            width: 400px;
            max-width: 100%;
            padding: 32px 36px 36px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .university-logo {
            width: 68px !important;
            height: 68px !important;
            max-width: 68px !important;
            max-height: 68px !important;
            margin: 0 auto 12px;
            display: block !important;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            color: #16383d;
            text-align: center;
            font-size: 21px;
            font-weight: 900;
            line-height: 1.7;
        }

        .university {
            margin: 8px 0 4px;
            color: #263f44;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
        }

        .english-name {
            margin: 0 0 25px;
            color: #839396;
            text-align: center;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.6;
            direction: ltr;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #294347;
            font-size: 14px;
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            color: #1f3438;
            background: #ffffff;
            border: 1px solid #c9d5d6;
            border-radius: 9px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #146b6d;
            box-shadow: 0 0 0 3px rgba(20, 107, 109, 0.13);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            color: #ffffff;
            background: #146b6d;
            border: 0;
            border-radius: 9px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background: #0f5658;
        }

        .message {
            margin: 0 0 18px;
            padding: 11px;
            text-align: center;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .error {
            color: #8a1d1d;
            background: #ffe5e5;
        }

        .success {
            color: #17613a;
            background: #e3f7e9;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
                background-attachment: scroll;
            }

            .login-card {
                padding: 28px 24px 30px;
            }

            .university-logo {
                width: 60px !important;
                height: 60px !important;
                max-width: 60px !important;
                max-height: 60px !important;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<main class="login-card">

    <img class="university-logo"
         src="/css/sutech-logo.png"
         th:src="@{/css/sutech-logo.png}"
         alt="لوگوی دانشگاه صنعتی شیراز"
         width="68"
         height="68">

    <h1>سامانه مدیریت حضور و غیاب</h1>

    <p class="university">دانشگاه صنعتی شیراز</p>
    <p class="english-name">Shiraz University of Technology</p>

    <div class="message error" th:if="${param.error}">
        نام کاربری یا رمز عبور نادرست است.
    </div>

    <div class="message success" th:if="${param.logout}">
        با موفقیت از سامانه خارج شدید.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">نام کاربری</label>
        <input id="username"
               name="username"
               type="text"
               autocomplete="username"
               required
               autofocus>

        <label for="password">رمز عبور</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>

        <button type="submit">ورود به سامانه</button>

    </form>

</main>

</body>
</html>

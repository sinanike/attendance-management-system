<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارش اضافه‌کاری واحد | مدیر</title>
    <link rel="stylesheet" th:href="@{/css/executive-portal.css(v=1)}">
</head>
<body class="portal-page">
<main class="portal-shell">
    <header class="portal-topbar">
        <div>
            <span class="portal-eyebrow">مدیریت واحد سازمانی</span>
            <h1>اضافه‌کاری کارکنان خدماتی</h1>
            <p th:text="|واحد ${department.name}|">واحد</p>
        </div>
    </header>

    <nav class="portal-nav">
        <a th:href="@{/manager/dashboard}">داشبورد</a>
        <a th:href="@{/manager/attendance}">حضور و غیاب</a>
        <a class="active" th:href="@{/manager/overtime}">اضافه‌کاری</a>
        <a th:href="@{/manager/insufficient-attendance}">حد نصاب حضور</a>
        <a th:href="@{/manager/performance}">ارزیابی سه‌ماهه</a>
    </nav>

    <section class="portal-panel">
        <form class="portal-filter" method="get" th:action="@{/manager/overtime}">
            <div class="portal-field"><label>از تاریخ</label><input type="date" name="fromDate" th:value="${fromDate}" required></div>
            <div class="portal-field"><label>تا تاریخ</label><input type="date" name="toDate" th:value="${toDate}" required></div>
            <div class="portal-filter-actions"><button class="portal-button primary" type="submit">نمایش</button></div>
        </form>
    </section>

    <section class="portal-stat-grid compact">
        <article class="portal-stat-card success">
            <span>مجموع اضافه‌کاری واحد</span>
            <strong th:text="|${totalOvertimeHours}:${#numbers.formatInteger(totalOvertimeRemainingMinutes, 2)}|">0:00</strong>
            <small>ساعت</small>
        </article>
        <article class="portal-stat-card info"><span>تعداد کارکنان گزارش</span><strong th:text="${rows.size()}">0</strong><small>نفر</small></article>
    </section>

    <section class="portal-panel">
        <div class="portal-table-wrapper">
            <table class="portal-table">
                <thead><tr><th>کارمند</th><th>کد پرسنلی</th><th>کارکرد</th><th>اضافه‌کاری</th><th>نرخ حضور</th></tr></thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td th:text="|${row.employee.firstName} ${row.employee.lastName}|">کارمند</td>
                    <td th:text="${row.employee.personnelCode}">EMP</td>
                    <td th:text="|${row.workedHours}:${#numbers.formatInteger(row.workedRemainingMinutes, 2)}|">0:00</td>
                    <td><strong th:text="|${row.overtimeHours}:${#numbers.formatInteger(row.overtimeRemainingMinutes, 2)}|">0:00</strong></td>
                    <td th:text="|${row.attendanceRate}%|">0%</td>
                </tr>
                <tr th:if="${rows.isEmpty()}"><td colspan="5" class="portal-empty">اطلاعاتی وجود ندارد.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
